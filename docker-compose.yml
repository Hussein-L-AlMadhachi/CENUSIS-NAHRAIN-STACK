services:
  mysql:
    image: mysql:8
    container_name: cenusis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cenusis_ops}
      MYSQL_USER: ${DB_USER:-dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev123456}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev123456}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cenusis-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cenusis-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cenusis_ops}
      DB_USER: ${DB_USER:-dev}
      DB_PASSWORD: ${DB_PASSWORD:-dev123456}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cenusis-network

volumes:
  mysql_data:
    driver: local

networks:
  cenusis-network:
    driver: bridge
